name: "Release"
on:
  release:
    types: [published]
permissions:
  contents: write
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JAVA_VERSION: '17.0.15' # this must be a specific version for reproducible builds
  RELEASE_TAG_PREFIX: 'rel-'
jobs:
  publish:
    name: "Publish to Sonatype"
    permissions:
      packages: read
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ steps.release_version.outputs.value }}
    steps:
      - name: "Store the current release version"
        id: release_version
        run: |
          export RELEASE_VERSION="${{ github.ref_name }}"
          export RELEASE_VERSION=${RELEASE_VERSION:${#RELEASE_TAG_PREFIX}}
          echo "Found Release Version: ${RELEASE_VERSION}"
          echo "value=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: rel-${{ steps.release_version.outputs.value }}
      - name: "Verify project version matches the release tag"
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}
        run: |
          PROJECT_VERSION="$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')"
          echo "Tag version:     ${RELEASE_VERSION}"
          echo "Project version: ${PROJECT_VERSION}"
          if [ "${PROJECT_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "::error::gradle.properties declares version '${PROJECT_VERSION}' but the release tag is 'rel-${RELEASE_VERSION}'."
            echo "::error::Bump 'version' in gradle.properties to '${RELEASE_VERSION}' and re-cut the tag on that commit."
            echo "::error::A '-SNAPSHOT' version disables the nexus-publish plugin in build.gradle, so the Sonatype publish tasks are never created."
            exit 1
          fi
      - name: "Ensure Common Build Date"
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: "Ensure source files use common date"
        run: |
          find . -depth \( -type f -o -type d \) -exec touch -d "@${SOURCE_DATE_EPOCH}" {} +
      - name: "Setup JDK"
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
      - name: "Publish to Sonatype"
        env:
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_KEY_ARMOR }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SECRING_PASSPHRASE }}
        run: >
          ./gradlew
          -PmavenMorpheusUser=${{ secrets.MAVEN_USERNAME }}
          -PmavenMorpheusPassword=${{ secrets.MAVEN_PASSWORD }}
          morpheus-plugin-api:publishMavenPublicationToSonatypeRepository
          morpheus-plugin-gradle:publishPluginMavenPublicationToSonatypeRepository
          morpheus-plugin-gradle:publishMorpheusPluginPluginMarkerMavenPublicationToSonatypeRepository
          closeSonatypeStagingRepository
  release:
    name: "Release Staging Repository"
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: rel-${{ needs.publish.outputs.release_version }}
      - name: "Setup JDK"
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
      - name: "Release staging repository"
        run: >
          ./gradlew
          -PmavenMorpheusUser=${{ secrets.MAVEN_USERNAME }}
          -PmavenMorpheusPassword=${{ secrets.MAVEN_PASSWORD }}
          findSonatypeStagingRepository
          releaseSonatypeStagingRepository
